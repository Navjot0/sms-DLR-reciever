# Local stack for SMS automation.
#
#   docker compose up -d --build                          PostgreSQL + receiver on :8080
#   docker compose up -d postgres                         PostgreSQL only (for mvn spring-boot:run / mvn verify)
#   docker compose --profile ha up -d --build             + 2nd receiver + nginx load balancer on :8081
#   docker compose --profile test run --rm automation     run the pytest examples against the receiver
#   docker compose down            (add -v to also wipe the database volume)

x-receiver-env: &receiver-env
  DB_URL: jdbc:postgresql://postgres:5432/dlr
  DB_USERNAME: dlr
  DB_PASSWORD: ${DB_PASSWORD:-dlr}
  DLR_TIMEZONE: Asia/Kolkata
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
  # Auth is off for local automation. For shared environments set DLR_AUTH_ENABLED=true
  # and configure at least one mechanism (see README "Security").
  DLR_AUTH_ENABLED: ${DLR_AUTH_ENABLED:-false}
  DLR_API_KEY_ENABLED: ${DLR_API_KEY_ENABLED:-false}
  DLR_API_KEYS: ${DLR_API_KEYS:-}
  DLR_HMAC_ENABLED: ${DLR_HMAC_ENABLED:-false}
  DLR_HMAC_SECRET: ${DLR_HMAC_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dlr
      POSTGRES_USER: dlr
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dlr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dlr-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlr -d dlr"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  dlr-receiver:
    build: .
    image: sms-dlr-receiver:1.0.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DLR_PORT:-8080}:8080"
    environment:
      <<: *receiver-env
      DLR_INSTANCE_ID: dlr-receiver-1
    restart: unless-stopped

  dlr-receiver-2:
    profiles: ["ha"]
    image: sms-dlr-receiver:1.0.0
    depends_on:
      postgres:
        condition: service_healthy
      dlr-receiver:
        condition: service_healthy
    environment:
      <<: *receiver-env
      DLR_INSTANCE_ID: dlr-receiver-2
    restart: unless-stopped

  load-balancer:
    profiles: ["ha"]
    image: nginx:1.27-alpine
    depends_on:
      dlr-receiver:
        condition: service_healthy
      dlr-receiver-2:
        condition: service_healthy
    ports:
      - "${DLR_LB_PORT:-8081}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  automation:
    profiles: ["test"]
    image: python:3.12-slim
    depends_on:
      dlr-receiver:
        condition: service_healthy
    working_dir: /automation
    volumes:
      - ./automation:/automation
    environment:
      DLR_BASE_URL: http://dlr-receiver:8080
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["sh", "-c", "pip install -q -r requirements.txt && pytest -q -p no:cacheprovider"]

volumes:
  dlr-pgdata:
