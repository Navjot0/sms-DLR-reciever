# Round-robin across two stateless receivers (docker compose --profile ha).
upstream dlr_receivers {
    server dlr-receiver:8080;
    server dlr-receiver-2:8080;
}

server {
    listen 80;
    client_max_body_size 1m;

    location / {
        proxy_pass http://dlr_receivers;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
