server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    max-swallow-size: 1MB
    threads:
      max: ${SERVER_MAX_THREADS:200}

spring:
  application:
    name: sms-dlr-receiver
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dlr}
    username: ${DB_USERNAME:dlr}
    password: ${DB_PASSWORD:dlr}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: dlr-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    # V7 was withdrawn (replaced by V8). Databases that did apply it must not fail validation.
    ignore-migration-patterns: "*:missing"
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  mvc:
    problemdetails:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:always}
      probes:
        enabled: true
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: sms-dlr-receiver
    distribution:
      percentiles-histogram:
        dlr.processing.latency: true

logging:
  level:
    root: INFO
    com.smsframework.dlr: INFO

# ---------------------------------------------------------------------------
# DLR receiver configuration (see DlrProperties for full documentation)
# ---------------------------------------------------------------------------
dlr:
  instance-id: ${DLR_INSTANCE_ID:}
  timezone: ${DLR_TIMEZONE:Asia/Kolkata}
  # Multipart SMS: status and billing DLRs may carry "<message_id>:<part>" (e.g. "c9b2...:1").
  # Stored as message_id "c9b2..." + part_number 1 so both DLRs correlate. Empty = no splitting.
  message-id-part-separator: ":"

  source-resolution:
    headers: [X-DLR-Source, X-DLR-Provider, source, provider]
    query-params: [source, provider]
    detect-from-payload: ${DLR_DETECT_FROM_PAYLOAD:true}
    aliases:
      DEFAULT: DEFAULT_SMS
      SMS: DEFAULT_SMS
      WE: WEBENGAGE
      WEB_ENGAGE: WEBENGAGE
      WHATSAPP: META
      WA: META
      META_WHATSAPP: META
      JIO: RCS
      DOTGO: RCS
      VI: RCS
      AIRTEL: RCS

  # NORMALIZED_STATUS -> provider statuses (case-insensitive). Unlisted -> UNKNOWN.
  status-mapping:
    DELIVERED: [DELIVRD, DELIVERED, SMS_DELIVERED, MESSAGE_DELIVERED]
    FAILED: [UNDELIV, FAILED, SMS_FAILED, MESSAGE_FAILED, INTERNAL_ERROR]
    EXPIRED: [EXPIRED, SMS_EXPIRED]
    REJECTED: [REJECTD, REJECTED, SMS_REJECTED]
    READ: [READ, MESSAGE_READ]       # WhatsApp (Meta) / RCS
    SENT: [SMS_SENT, SUBMITTED, SENT, MESSAGE_SENT]

  # Optional per-provider overrides, checked before the global mapping:
  # provider-status-mapping:
  #   WEBENGAGE:
  #     DELIVERED: [sms_delivered]

  state-machine:
    # CURRENT -> allowed NEXT. Final states map to [] (no downgrade, no flip-flop).
    # To allow e.g. a late DELIVERED to override FAILED: FAILED: [DELIVERED]
    transitions:
      UNKNOWN: [SENT, DELIVERED, READ, FAILED, EXPIRED, REJECTED]
      SENT: [DELIVERED, READ, FAILED, EXPIRED, REJECTED]
      DELIVERED: [READ]                  # WhatsApp: read receipt after delivery
      READ: []
      FAILED: []
      EXPIRED: []
      REJECTED: []

  idempotency:
    key-fields: [source, message_id, provider_status, status_code, provider_event_id, dlr_received_at]
    store-duplicates: true

  api:
    max-verify-ids: 10000
    # Billing callbacks for bulk campaigns carry one event per recipient (500 events is ~100 KB).
    max-payload-bytes: ${DLR_MAX_PAYLOAD_BYTES:10485760}
    rejected-http-status: 400
    max-events-page-size: 500

  # Short-link click events: {"event":"short_link","data":{"message_id":"<id>:1","url_key":...,"visited_count":...}}
  # received on /api/v1/dlr/receive and correlated to the status DLR by message_id.
  clicks:
    enabled: ${DLR_CLICKS_ENABLED:true}
    event-types: [short_link]
    default-source: DEFAULT_SMS          # recorded when the callback carries no X-DLR-Source
    sources: [DEFAULT_SMS]               # sources allowed to send click events

  # RCS DLRs: the Jio, Dotgo, Vi and Airtel operator formats are detected from the payload (or send
  # ?source=RCS / JIO / DOTGO / VI / AIRTEL). The operator is stored in the "service" column.

  # Meta (WhatsApp Cloud API) webhooks: {"object":"whatsapp_business_account","entry":[...statuses...]}
  # posted to /api/v1/dlr/receive (detected from the payload, or ?source=META). Always answered 200.
  # Meta's callback-URL check (GET ?hub.mode=subscribe&hub.verify_token=..&hub.challenge=..) needs this token.
  # Signature: set DLR_HMAC_ENABLED=true, header X-Hub-Signature-256 and the app secret as DLR_HMAC_SECRET.
  meta:
    verify-token: ${DLR_META_VERIFY_TOKEN:}
    # message_id is the platform's own id inside each status ({"id":"wamid...","message_id":"<uuid>"}).
    # true: a status without it is stored as REJECTED. false: fall back to the wamid as message_id.
    require-message-id: ${DLR_META_REQUIRE_MESSAGE_ID:true}

  # Billing DLRs: {"event_type":"billing","events":[{"transaction_type":"debit","message_id":"<id>:1",...}]}
  # received on the same /api/v1/dlr/receive endpoint and correlated to the status DLR by message_id.
  billing:
    enabled: ${DLR_BILLING_ENABLED:true}
    event-type: billing
    default-source: DEFAULT_SMS          # recorded when the callback carries no X-DLR-Source
    sources: [DEFAULT_SMS]               # sources allowed to send billing DLRs
    debit-types: [debit]
    credit-types: [credit, refund, reversal]
    max-events-per-callback: ${DLR_BILLING_MAX_EVENTS:50000}

  security:
    enabled: ${DLR_AUTH_ENABLED:false}
    enforce-in-profiles: [prod, production]
    callback-paths: [/api/v1/dlr/receive]
    protect-query-api: ${DLR_PROTECT_QUERY_API:false}
    api-key:
      enabled: ${DLR_API_KEY_ENABLED:false}
      header-name: X-API-Key
      keys: ${DLR_API_KEYS:}
    bearer:
      enabled: ${DLR_BEARER_ENABLED:false}
      tokens: ${DLR_BEARER_TOKENS:}
    ip-allowlist:
      enabled: ${DLR_IP_ALLOWLIST_ENABLED:false}
      cidrs: ${DLR_IP_ALLOWLIST:}
      trust-forwarded-for: ${DLR_TRUST_FORWARDED_FOR:false}
    hmac:
      enabled: ${DLR_HMAC_ENABLED:false}
      header-name: X-DLR-Signature
      secret: ${DLR_HMAC_SECRET:}
      algorithm: HmacSHA256
      timestamp-header-name: X-DLR-Timestamp
      require-timestamp: ${DLR_HMAC_REQUIRE_TIMESTAMP:false}
      max-skew-seconds: 300

---
# JSON (logstash-format) structured logs for containers/production (Spring Boot 3.4+ built-in).
spring:
  config:
    activate:
      on-profile: docker | prod | production
logging:
  structured:
    format:
      console: logstash

---
spring:
  config:
    activate:
      on-profile: prod | production
dlr:
  security:
    enabled: ${DLR_AUTH_ENABLED:true}
management:
  endpoint:
    health:
      show-details: when-authorized
